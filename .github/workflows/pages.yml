# Publish site/ to GitHub Pages on every push to main (or by hand), only after verify passes (R2).
# One-time repo setting: Settings → Pages → Source = "GitHub Actions".
# The artifact is uploaded in one job and deployed in the next: deploy-pages cannot see an artifact
# uploaded earlier in the same job.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: ./scripts/verify.sh

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Stamp the release version (cache busting)
        run: node scripts/stamp-version.mjs site "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: # only the deploy job may publish
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A re-run of an old run (or of only this job) would publish that run's old files.
      - name: Refuse to deploy anything but the tip of main
        run: |
          latest=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ -z "$latest" ] || [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::This run is for $GITHUB_SHA but main is now ${latest:-unknown}. Not deploying an old version; push to main (or run the workflow on main) instead."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
